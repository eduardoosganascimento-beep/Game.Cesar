services:
  - type: web
    name: sandman-database
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_FILE
        value: /opt/render/project/src/data/db.json
